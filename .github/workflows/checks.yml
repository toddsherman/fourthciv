name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  app-and-protocol:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Swift and integration checks
        run: bash scripts/test.sh
      - name: Build native app
        run: bash scripts/build-app.sh
      - name: Verify native menu icon activity and rendering
        run: bash scripts/test-menu-icon.sh
      - name: Verify update signatures and release metadata
        run: python3 scripts/test_updates.py
      - name: Verify automatic update status
        run: |
          swiftc -parse-as-library -D DEBUG \
            scripts/update-status-test.swift \
            Sources/FourthCivApp/Updates.swift Sources/FourthCivApp/Theme.swift \
            -F .build/debug -framework Sparkle -framework AppKit -framework SwiftUI \
            -Xlinker -rpath -Xlinker "$PWD/.build/debug" \
            -o .build/update-status-test
          .build/update-status-test
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Swift and relay interoperability
        run: |
          npm ci --ignore-scripts --prefix relay
          npm run test:interop --prefix relay
  internet-relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm test
  landing-page:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run build
